name: Install Scripts

on:
  pull_request:
    paths:
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/install-scripts.yml"
  push:
    branches:
      - main
    paths:
      - "install.sh"
      - "install.ps1"

jobs:
  install-script:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run install.sh
        run: |
          bash install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify minitest is usable
        run: minitest --help

      - name: Warn when another minitest comes first in PATH
        run: |
          fake="$RUNNER_TEMP/ruby/bin"
          mkdir -p "$fake"
          printf '#!/bin/sh\necho "minitest 6.0.0"\n' > "$fake/minitest"
          chmod +x "$fake/minitest"
          PATH="$fake:$PATH" bash install.sh | tee install.log
          grep -F "'minitest' in your PATH runs $fake/minitest (minitest 6.0.0), not minitest-cli." install.log

  install-script-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run install.ps1
        shell: pwsh
        run: |
          .\install.ps1
          "$env:USERPROFILE\.local\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Verify minitest is usable
        shell: pwsh
        run: minitest --help

      - name: Warn when another minitest comes first in PATH
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "ruby\bin"
          New-Item -ItemType Directory -Force $fake | Out-Null
          Set-Content -Path (Join-Path $fake "minitest.bat") -Value "@echo minitest 6.0.0"
          $env:PATH = "$fake;$env:PATH"
          $out = .\install.ps1 *>&1 | Out-String
          Write-Host $out
          if (-not $out.Contains("not minitest-cli.")) { throw "install.ps1 did not report the foreign minitest" }
